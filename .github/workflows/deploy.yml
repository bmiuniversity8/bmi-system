name: Deploy BMI System

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # E2E tests run weekly on Monday

# Cancel in-progress runs on same branch to avoid queue pileup
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.12.0'

jobs:
  # ─── Detect Changes ─────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      portal: ${{ steps.filter.outputs.portal }}
      ums: ${{ steps.filter.outputs.ums }}
      university: ${{ steps.filter.outputs.university }}
    steps:
      - uses: actions/checkout@v4

      - name: Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            portal:
              - 'apps/portal/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            ums:
              - 'apps/ums/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            university:
              - 'bmi-university/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/deploy.yml'

  # ─── CI Checks ──────────────────────────────────────────────────────────────
  # Turbo parallelises all tasks across CPU cores using content-hash caching.
  # Unchanged packages are replayed from cache — not rebuilt.
  ci-checks:
    name: CI Checks (build + lint + typecheck + test)
    runs-on: ubuntu-latest
    needs: changes
    if: >
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.portal == 'true' ||
      needs.changes.outputs.ums == 'true' ||
      needs.changes.outputs.university == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Run CI (build + lint + typecheck + test)
        run: pnpm exec turbo run build lint type-check test --concurrency=100%

      - name: Save Turborepo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # ─── E2E Tests (Weekly Only) ────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/ums
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/ums
        run: pnpm run test:e2e

  # ─── Deploy API Worker ───────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: [changes, ci-checks]
    if: github.event_name == 'push' && needs.changes.outputs.api == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build API
        run: pnpm exec turbo run build --filter=@bmi/api --concurrency=100%

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter @bmi/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Deploy Portal ───────────────────────────────────────────────────────────
  deploy-portal:
    name: Deploy Portal (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [changes, ci-checks]
    if: github.event_name == 'push' && needs.changes.outputs.portal == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build Portal
        run: pnpm exec turbo run build --filter=bmi-portal --concurrency=100%
        env:
          NODE_ENV: production
          VITE_API_URL: 'https://bmi-api.bmiuniversity107.workers.dev'

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter bmi-portal exec wrangler pages deploy dist --project-name=bmi-portal --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Deploy UMS ──────────────────────────────────────────────────────────────
  deploy-ums:
    name: Deploy UMS (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [changes, ci-checks]
    if: github.event_name == 'push' && needs.changes.outputs.ums == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build UMS
        run: pnpm exec turbo run build --filter=bmi-ums-frontend --concurrency=100%
        env:
          NODE_ENV: production
          VITE_API_URL: 'https://bmi-api.bmiuniversity107.workers.dev'

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter bmi-ums-frontend exec wrangler pages deploy dist --project-name=bmi-ums --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Deploy University ───────────────────────────────────────────────────────
  deploy-university:
    name: Deploy University (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [changes, ci-checks]
    if: github.event_name == 'push' && needs.changes.outputs.university == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build University
        run: pnpm exec turbo run build --filter=bmi-university --concurrency=100%

      - name: Verify build output
        run: |
          echo "=== Checking out/ directory ==="
          ls -la bmi-university/out/
          test -f bmi-university/out/index.html && echo "✅ index.html found" || (echo "❌ index.html NOT found" && exit 1)

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter bmi-university exec wrangler pages deploy out --project-name=bmi-university --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
