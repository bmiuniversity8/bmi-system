name: Preview Deployments

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.12.0'

jobs:
  # ─── Preview Portal ──────────────────────────────────────────────────────────
  preview-portal:
    name: Preview Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Portal
        run: pnpm exec turbo run build --filter=bmi-portal --concurrency=100%
        env:
          NODE_ENV: production
          VITE_API_URL: 'https://bmi-api.bmiuniversity107.workers.dev'

      - name: Deploy Preview to Cloudflare Pages
        run: pnpm --filter bmi-portal exec wrangler pages deploy dist --project-name=bmi-portal --branch=${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Preview UMS ─────────────────────────────────────────────────────────────
  preview-ums:
    name: Preview UMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UMS
        run: pnpm exec turbo run build --filter=bmi-ums-frontend --concurrency=100%
        env:
          NODE_ENV: production
          VITE_API_URL: 'https://bmi-api.bmiuniversity107.workers.dev'

      - name: Deploy Preview to Cloudflare Pages
        run: pnpm --filter bmi-ums-frontend exec wrangler pages deploy dist --project-name=bmi-ums --branch=${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Preview University ───────────────────────────────────────────────────────
  preview-university:
    name: Preview University
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build University
        run: pnpm exec turbo run build --filter=bmi-university --concurrency=100%

      - name: Deploy Preview to Cloudflare Pages
        run: pnpm --filter bmi-university exec wrangler pages deploy out --project-name=bmi-university --branch=${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
